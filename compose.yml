services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes: ["learning_data:/data"]
    restart: unless-stopped
  worker:
    build: .
    command: ["/app/.venv/bin/python", "-m", "learninglab.worker"]
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes: ["learning_data:/data"]
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "/app/.venv/bin/python", "-m", "learninglab.worker", "--health"]
      interval: 60s
      timeout: 5s
      start_period: 120s
volumes:
  learning_data:
