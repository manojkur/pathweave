name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.12'
      - run: uv sync --frozen
      - run: uv run ruff check learninglab scripts tests
      - run: uv run pytest -q
      - run: node --check learninglab/static/app.js
      - run: node --check learninglab/static/visuals.js
      - name: Public source boundary
        run: |
          test -z "$(git ls-files '*.pdf' '*.sqlite*' '.env' 'runtime/*')"
