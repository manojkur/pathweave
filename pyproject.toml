[project]
name = "learninglab-core"
version = "0.1.0"
description = "An open research platform for connected, evidence-informed learning"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.120,<1", "uvicorn>=0.38,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

